api_nim:
  base_url: https://integrate.api.nvidia.com/v1
  key: ""

api_ollama:
  base_url: https://ollama.com/v1
  key: ""

api_cloudflare:
  base_url: https://api.cloudflare.com/client/v4/accounts/bbfd16b81a96771b6822c4df3f71cfaa/ai/v1
  key: ""

defaults:
  max_tokens: 10000
  max_history_messages: 25
  max_search_urls: 5
  temperature: 0.5
  system_prompt: ""

default_model:
  nim: openai/gpt-oss-20b
  ollama: gpt-oss:20b-cloud
  cloudflare: "@cf/openai/gpt-oss-20b"

title_model:
  nim: meta/llama-3.2-11b-vision-instruct
  ollama: gemma4:31b-cloud
  cloudflare: "@cf/aisingapore/gemma-sea-lion-v4-27b-it"

rewrite_model:
  nim: meta/llama-3.2-11b-vision-instruct
  ollama: gemma4:31b-cloud
  cloudflare: "@cf/aisingapore/gemma-sea-lion-v4-27b-it"

search_gate_model:
  nim: meta/llama-3.2-11b-vision-instruct
  ollama: gemma4:31b-cloud
  cloudflare: "@cf/aisingapore/gemma-sea-lion-v4-27b-it"

compact_model:
  nim: meta/llama-3.2-11b-vision-instruct
  ollama: gemma4:31b-cloud
  cloudflare: "@cf/aisingapore/gemma-sea-lion-v4-27b-it"

embed_model_fastembed: BAAI/bge-base-en-v1.5

