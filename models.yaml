api_nim:
  base_url: https://integrate.api.nvidia.com/v1
  key: ""

api_ollama:
  base_url: http://localhost:11434/v1
  key: ""

api_cloudflare:
  base_url: https://api.cloudflare.com/client/v4/accounts/bbfd16b81a96771b6822c4df3f71cfaa/ai/v1
  key: ""
  account_id: bbfd16b81a96771b6822c4df3f71cfaa

defaults:
  max_tokens: 12345
  max_history_turns: 36
  max_search_urls: 5
  temperature: 0.5
  system_prompt: ""

default_model_nim: openai/gpt-oss-120b
default_model_ollama: gpt-oss:120b-cloud
default_model_cloudflare: "@cf/openai/gpt-oss-120b"

title_model_nim: mistralai/mistral-large-3-675b-instruct-2512
title_model_ollama: gemma4:31b-cloud
title_model_cloudflare: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

rewrite_model_nim: mistralai/mistral-large-3-675b-instruct-2512
rewrite_model_ollama: gemma4:31b-cloud
rewrite_model_cloudflare: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

embed_model_fastembed: BAAI/bge-base-en-v1.5

